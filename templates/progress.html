<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Quiz Score Pie Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Verdana:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/homepage.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }
        canvas {
            max-width: 500px;
            margin: auto;
        }
    </style>
     
</head>
<body>
    <header class="p-3">
        <div class="container">
          <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
            <a href="../Home.php" class="d-flex align-items-center mb-2 mb-lg-0">
              <svg class="bi me-2" width="40" height="32" role="img" aria-label="Bootstrap"><use xlink:href="#bootstrap"></use></svg>
            </a>
            <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
              <li><a href="../Home.php" class="nav-link px-2">Home</a></li>
              <li><a href="aboutdy.html" class="nav-link px-2">About Dyslexia</a></li>
              <li><a href="speech.html" class="nav-link px-2">Speech</a></li>
              <li><a href="homepage.html" class="nav-link px-2">Learn</a></li>
              <li><a href="progress.html" class="nav-link px-2">Progress</a></li>
              <li><a href="about.html" class="nav-link px-2">About Us</a></li>
            </ul>
            
          </div>
        </div>
    </header>
    <h1>Your Quiz Score Pie Chart</h1>
    <canvas id="scoreChart"></canvas>

    <script>
        fetch('../fetch_scores.php')
            .then(response => response.json())
            .then(data => {
                const lessons = data.lessons;
                const scores = data.scores;

                const ctx = document.getElementById('scoreChart').getContext('2d');

                const scoreChart = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: lessons,
                        datasets: [{
                            label: 'Your Scores',
                            data: scores,
                            backgroundColor: [
                                'rgba(255, 99, 132, 0.7)',
                                'rgba(54, 162, 235, 0.7)',
                                'rgba(255, 206, 86, 0.7)',
                                'rgba(75, 192, 192, 0.7)',
                                'rgba(153, 102, 255, 0.7)',
                                'rgba(255, 159, 64, 0.7)'
                            ],
                            borderColor: '#fff',
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    font: {
                                        size: 14
                                    }
                                }
                            },
                            tooltip: {
                                backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                titleColor: '#fff',
                                bodyColor: '#fff',
                                borderColor: '#ccc',
                                borderWidth: 1
                            }
                        }
                    }
                });
            })
            .catch(error => console.error('Error fetching data:', error));
    </script>
</body>
</html>
