<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech to Text Example</title>
</head>
<body>
    <h1>Speech to Text Demo</h1>
    <button id="start-btn">Start Listening</button>
    <p>Transcribed Text:</p>
    <div id="result" style="border: 1px solid #ccc; padding: 10px; min-height: 50px;"></div>

    <script>
        const startButton = document.getElementById("start-btn");
        const statusElement = document.getElementById("result");

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = "en-US";
            recognition.continuous = true;

            startButton.addEventListener("click", function() {
                statusElement.textContent = "Starting speech recognition...";
                recognition.start();
            });

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                statusElement.textContent = "You said: " + transcript;
            };

            recognition.onerror = function(event) {
                statusElement.textContent = "Error: " + event.error;
            };
        } else {
            statusElement.textContent = "Speech Recognition is not supported in this browser.";
        }
    </script>
</body>
</html>
